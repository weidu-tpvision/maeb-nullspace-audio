[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maeb-nullspace-audio"
version = "0.1.0"
description = "Reimplementation of zero-training null-space audio embedding extension for EmbeddingGemma-2 on MAEB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.3",
    "transformers>=4.49.0",
    "datasets>=2.20.0",
    "scikit-learn>=1.5.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
]

[project.optional-dependencies]
eval = [
    "mteb>=2.8.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nullspace_audio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
